[project]
name = "alteros-companion-runtime"
version = "0.1.0"
description = "Private, bounded AlterOS conversation sidecar"
requires-python = ">=3.13,<3.14"
dependencies = [
  "httpx==0.28.1",
  "langgraph==1.2.15",
  "pydantic==2.14.1",
]

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = ["pytest==9.1.1"]
build = ["pyinstaller==6.22.3"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
