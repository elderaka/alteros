[project]
name = "alteros-semantic-lab"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "sentence-transformers>=5.1,<6",
  "torch>=2.14; sys_platform == 'win32'",
  "transformers>=4.41,<5",
]

[project.optional-dependencies]
export = [
  "onnx>=1.17,<2",
  "onnxconverter-common>=1.14,<2",
  "onnxscript>=0.3,<1",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cu130", marker = "sys_platform == 'win32'" }]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
